BATLEXP-UBOOT-CONFIG

setenv bootargs "root=/dev/mmcblk0p2 rootfstype=ext4 rw rootwait quiet loglevel=0 fbcon=nodefer vt.global_cursor_default=0 init=/sbin/init"
setenv loadaddr "0x02000000"
setenv dtb_loadaddr "0x1000000"

if test "${hwrev}" = "1"; then
	setenv g350_dtb "rk3326-batlexp-linux1.dtb"
else
	setenv g350_dtb "rk3326-batlexp-linux.dtb"
fi

load mmc 1:1 ${loadaddr} Image
load mmc 1:1 ${dtb_loadaddr} ${g350_dtb}
booti ${loadaddr} - ${dtb_loadaddr}
