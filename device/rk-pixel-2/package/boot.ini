setenv bootargs "root=PARTLABEL=ROOTFS rw rootwait rootfstype=ext4 console=null fbcon=rotate:3 fbcon=map:1 quiet loglevel=0 printk.devkmsg=off consoleblank=0 vt.global_cursor_default=0 net.ifnames=0 init=/sbin/init"
setenv loadaddr 0x02000000
setenv dtb_loadaddr 0x1000000
fatload mmc 1:1 ${loadaddr} Image
fatload mmc 1:1 ${dtb_loadaddr} rk3326s-gkd-pixel2.dtb
booti ${loadaddr} - ${dtb_loadaddr}
