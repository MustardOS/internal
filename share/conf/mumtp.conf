loop_on_disconnect 0
show_hidden_files 1
umask 022

storage "/run/muos/mtp" "Storage" "rw"

manufacturer "MustardOS"
product "Device"
serial "Serial"
firmware_version "Version"
mtp_extensions "microsoft.com: 1.0;"
interface "MTP"

usb_vendor_id 0x1D6B
usb_product_id 0x0100
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x3008

sync_when_close 0x1

usb_functionfs_mode 0x1
usb_dev_path "/dev/usb-ffs/mtp/ep0"
usb_epin_path "/dev/usb-ffs/mtp/ep1"
usb_epout_path "/dev/usb-ffs/mtp/ep2"
usb_epint_path "/dev/usb-ffs/mtp/ep3"
usb_max_packet_size 0x200
