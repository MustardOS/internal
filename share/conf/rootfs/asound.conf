pcm.!default {
    type plug
    slave.pcm {
        type pipewire
        playback_node "-1"
        capture_node "-1"
    }
    hint {
        show on
        description "Default ALSA Output (PipeWire)"
    }
}

pcm.pipewire {
    type pipewire
    playback_node "-1"
    capture_node "-1"
    hint {
        show on
        description "PipeWire Sound Server"
    }
}

ctl.!default {
    type pipewire
}

ctl.pipewire {
    type pipewire
}
